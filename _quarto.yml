project:
  type: website
  output-dir: _site
  # Explicit allowlist. Without it Quarto renders every Markdown file it finds,
  # including maintainer-local notes under docs/, which are gitignored but would
  # still be published by any local render.
  render:
    - "*.qmd"
    - "projects/*.qmd"
  # The favicon and social-preview card are copied verbatim to _site/images/.
  # (The self-hosted fonts under fonts/ need no entry here: Quarto discovers them
  # from the theme CSS url() and bundles them next to the compiled stylesheet.)
  resources:
    - "images/"

website:
  title: "A(I)rbeitskreis"
  description: "How a group of academics actually uses AI in teaching and research."
  site-url: "https://caspardp.github.io/airbeitskreis"
  repo-url: "https://github.com/CasparDP/airbeitskreis"
  favicon: images/favicon.png
  # One site-wide social-preview card. Quarto emits the og:image and twitter:image
  # tags from this; open-graph/twitter cards are enabled below.
  image: images/og-card.png
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: "Home"
      - href: projects/index.qmd
        text: "Projects"
      - href: contribute.qmd
        text: "Contribute"
      - href: about.qmd
        text: "About"
    right:
      - icon: github
        href: "https://github.com/CasparDP/airbeitskreis"
        aria-label: "Source on GitHub"
  page-footer:
    left: "Code MIT, content CC BY 4.0."
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme:
      light: [cosmo, theme/light.scss, theme/shared.scss]
      dark: [cosmo, theme/dark.scss, theme/shared.scss]
    toc: true
    anchor-sections: true
